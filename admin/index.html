<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Portfolio Admin CMS — Yogendra Chaudhary</title>
<link href="/assets/media/home-media-01-a8072a2c986d.png" rel="icon" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-dark: #0a0a0c;
  --bg-card: #131418;
  --bg-elevated: #1a1b22;
  --bg-input: #101115;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: #f37021;
  --primary: #f37021;
  --primary-hover: #ff853a;
  --primary-glow: rgba(243, 112, 33, 0.18);
  --text-main: #f0f0f4;
  --text-muted: #8e8ea0;
  --text-dim: #5c5c6e;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --sidebar-w: 260px;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.5;
  font-size: 14px;
  min-height: 100vh;
}
/* Layout */
#loginView {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: radial-gradient(circle at 50% 20%, rgba(243, 112, 33, 0.06), transparent 70%), var(--bg-dark);
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.login-brand {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-main);
  margin-bottom: 6px;
}
.login-brand span { color: var(--primary); }
.login-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s ease;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-main);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-danger {
  background: rgba(239, 68, 68, 0.15);
  color: var(--danger);
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block { width: 100%; }

/* Admin App Shell */
#adminApp {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
}
.sidebar-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-brand {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-main);
}
.nav-item.active {
  background: var(--primary-glow);
  color: var(--primary);
  font-weight: 600;
}
.nav-item .material-symbols-rounded { font-size: 18px; }
.nav-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 12px 14px 4px;
  letter-spacing: 0.08em;
}
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 13px;
}
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--text-muted); }

/* Main Content */
.main-wrapper {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 64px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(10, 10, 12, 0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 90;
}
.topbar-title {
  font-size: 18px;
  font-weight: 700;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(16, 185, 129, 0.1);
  color: var(--success);
  border: 1px solid rgba(16, 185, 129, 0.2);
}
.status-pill.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.2);
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.content-area {
  padding: 32px;
  max-width: 1200px;
  width: 100%;
}

/* Cards & Sections */
.admin-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* Tables & Lists */
.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.05em;
}
.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-main);
  font-size: 13px;
  vertical-align: middle;
}
.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}
.badge {
  display: inline-block;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  text-transform: uppercase;
}
.badge-published { background: rgba(16, 185, 129, 0.15); color: var(--success); }
.badge-draft { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

/* Notifications / Toasts */
#toastBox {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 1000;
}
.toast {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-main);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.25s ease;
}
.toast.success { border-color: rgba(16, 185, 129, 0.4); border-left: 4px solid var(--success); }
.toast.error { border-color: rgba(239, 68, 68, 0.4); border-left: 4px solid var(--danger); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.modal-card {
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }

/* Media Grid */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}
.media-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  transition: all 0.2s ease;
}
.media-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.media-thumb-box {
  width: 100%;
  height: 120px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.media-thumb-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.media-meta-box {
  padding: 10px;
}
.media-title-text {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.media-sub-text { font-size: 11px; color: var(--text-dim); }

@media (max-width: 900px) {
  .sidebar { width: 70px; }
  .sidebar .nav-item span:not(.material-symbols-rounded), .sidebar-header span, .sidebar-footer .user-info, .nav-section-title { display: none; }
  .main-wrapper { margin-left: 70px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Login View -->
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">YOGENDRA <span>CMS</span></div>
    <div class="login-sub">Sign in to manage portfolio content and case studies</div>

          </form>

<!-- Admin App Shell -->

  <!-- Sidebar -->

        <span class="material-symbols-rounded">navigation</span>

      </button>

        <span class="material-symbols-rounded">travel_explore</span>

    <div class="sidebar-footer">

  <!-- Main Area -->

<!-- Modal Container -->

<!-- Toast Box -->

<script>
// State
let currentTab = 'dashboard';
let cachedData = {};
let projectCoverUploadPromise = Promise.resolve(true);

// Helpers
function showToast(msg, type = 'success') {
  const box = document.getElementById('toastBox');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span class="material-symbols-rounded">${type === 'success' ? 'check_circle' : 'error'}</span><span>${msg}</span>`;
  box.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 4000);
}

function getAuthToken() {
  try {
    return sessionStorage.getItem('cms_token') || localStorage.getItem('cms_token') || '';
  } catch (e) {
    return '';
  }
}

function setAuthToken(token) {
  try {
    if (token) {
      sessionStorage.setItem('cms_token', token);
      localStorage.setItem('cms_token', token);
    } else {
      sessionStorage.removeItem('cms_token');
      localStorage.removeItem('cms_token');
    }
  } catch (e) {}
}

async function apiFetch(endpoint, options = {}) {
  try {
    const token = getAuthToken();
    const headers = {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
      ...(options.headers || {})
    };
    const res = await fetch(endpoint, {
      credentials: 'include',
      ...options,
      headers
    });
    if (res.status === 401) {
      setAuthToken('');
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('adminApp').style.display = 'none';
      throw new Error('Session expired or authentication required');
    }
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Server error occurred');
    }
    return data;
  } catch (err) {
    showToast(err.message, 'error');
    throw err;
  }
}

// Authentication
async function checkAuth() {
  try {
    const token = getAuthToken();
    const headers = {};
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
    }
    const res = await fetch('/api/admin/me', {
      credentials: 'include',
      headers
    });
    const data = await res.json();
    if (data.authenticated && data.user) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('adminApp').style.display = 'flex';
      document.getElementById('displayUsername').textContent = data.user.username;
      document.getElementById('avatarInitial').textContent = (data.user.username || 'Z').charAt(0);
      switchTab(currentTab || 'dashboard');
    } else {
      setAuthToken('');
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('adminApp').style.display = 'none';
    }
  } catch (e) {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('adminApp').style.display = 'none';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const u = (document.getElementById('loginUsername').value || '').trim();
  const p = (document.getElementById('loginPassword').value || '').trim();
  const btn = document.getElementById('loginSubmitBtn');
  const errBox = document.getElementById('loginError');

  btn.disabled = true;
  btn.innerHTML = '<span>Signing in...</span>';
  errBox.style.display = 'none';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Invalid credentials');
    }
    if (data.token) {
      setAuthToken(data.token);
    }
    showToast('Signed in successfully!');
    await checkAuth();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Sign In</span><span class="material-symbols-rounded">arrow_forward</span>';
  }
}

async function handleLogout() {
  try {
    const token = getAuthToken();
    await fetch('/api/admin/logout', { 
      method: 'POST',
      credentials: 'include',
      headers: token ? { 'Authorization': `Bearer ${token}` } : {}
    });
  } catch (e) {
    // proceed
  }
  setAuthToken('');
  showToast('Logged out');
  await checkAuth();
}

// Tabs
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(b => b.classList.remove('active'));
  const activeBtn = document.querySelector(`.sidebar-nav .nav-item[onclick*="${tab}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const titles = {
    dashboard: 'Dashboard',
    homepage: 'Homepage & Hero Content',
    projects: 'Projects & Case Studies',
    experience: 'Experience Timeline',
    education: 'Education & Languages',
    media: 'Media Library',
    resume: 'Resume PDF Management',
    navigation: 'Navigation & Links',
    seo: 'SEO & Social Meta',
    backups: 'Version History & Snapshots',
    security: 'Account & Security'
  };

async function saveHomepage(e) {
  e.preventDefault();
  const payload = {
    heroKicker: document.getElementById('heroKicker').value,
    heroSubtitle: document.getElementById('heroSubtitle').value,
    heroNameFirst: document.getElementById('heroNameFirst').value,
    heroNameLast: document.getElementById('heroNameLast').value,

    heroSecondaryBtnText: document.getElementById('heroSecondaryBtnText').value,
    idCard: {
      tag: document.getElementById('badgeTag').value,
      name: document.getElementById('badgeName').value,
      role: document.getElementById('badgeRole').value,
      photo: document.getElementById('badgePhoto').value,
      micro: document.getElementById('badgeMicro').value
    },
    aboutSection: {
      kicker: document.getElementById('aboutKicker').value,
      title: document.getElementById('aboutTitle').value,
      lead: document.getElementById('aboutLead').value
    }
  };

  await apiFetch('/api/admin/pages/home', {
    method: 'PUT',
    body: JSON.stringify(payload)
  });
  showToast('Homepage changes saved and published to Firestore!');
}

// Media upload handler
async function uploadMediaFile() {
  const fileInput = document.getElementById('mediaFileInput');
  if (!fileInput.files || !fileInput.files[0]) {
    return alert('Please select a file first.');
  }

  const formData = new FormData();
  try {
    formData.append('file', fileInput.files[0]);
    const token = getAuthToken();
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/admin/media/upload', {
      method: 'POST',
      credentials: 'include',
      headers,
      body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    showToast('File uploaded successfully!');
    renderTabContent('media');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

          </div>

          </div>
          <div class="form-group">
            <label class="form-label">Media Note</label>
            <input class="form-input" id="modalProjMediaNote" value="${proj.mediaNote || ''}"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="modalProjCoverFile">Cover Image</label>
            <input class="form-input" id="modalProjCoverFile" type="file" accept="image/*" onchange="uploadProjectCoverImage()"/>
            <div id="modalProjCoverStatus" style="font-size:12px;color:var(--text-dim);margin-top:6px;">${proj.coverImage ? 'Current image shown below. Choose a file to replace it.' : 'Choose an image file from your device.'}</div>
            <div id="modalProjCoverPreview" style="${proj.coverImage ? 'display:block;' : 'display:none;'}margin-top:10px;max-width:320px;">
              <img id="modalProjCoverPreviewImage" src="${proj.coverImage || ''}" alt="Project cover preview" style="display:block;width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--border);"/>
            </div>
            <input type="hidden" id="modalProjCover" value="${proj.coverImage || ''}"/>
          </div>
          <div class="form-group">
            <label class="form-label">Summary / Description</label>
            <textarea class="form-textarea" id="modalProjSummary" rows="3">${proj.summary || ''}</textarea>

async function handleProjectSubmit(e, id) {
  e.preventDefault();
  const coverUploadSucceeded = await projectCoverUploadPromise;
  if (!coverUploadSucceeded) {
    showToast('Cover image upload failed. Please choose the file again.', 'error');
    return;
  }
  const payload = {
    title: document.getElementById('modalProjTitle').value,
    slug: document.getElementById('modalProjSlug').value,
    category: document.getElementById('modalProjCategory').value,
    year: document.getElementById('modalProjYear').value,
    order: Number(document.getElementById('modalProjOrder').value),
    categoryLabel: document.getElementById('modalProjLabel').value,
    mediaNote: document.getElementById('modalProjMediaNote').value,
    coverImage: document.getElementById('modalProjCover').value,
    summary: document.getElementById('modalProjSummary').value,
    status: document.getElementById('modalProjStatus').value
  };

  if (id) {
    await apiFetch(`/api/admin/projects/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
    showToast('Project updated successfully!');
  } else {
    await apiFetch('/api/admin/projects', { method: 'POST', body: JSON.stringify(payload) });
    showToast('New project created and published!');
  }
  document.getElementById('modalContainer').style.display = 'none';
  renderTabContent('projects');
}

async function uploadProjectCoverImage() {
  const fileInput = document.getElementById('modalProjCoverFile');
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;

  const status = document.getElementById('modalProjCoverStatus');
  const preview = document.getElementById('modalProjCoverPreview');
  const previewImage = document.getElementById('modalProjCoverPreviewImage');
  status.textContent = `Uploading ${file.name}...`;
  fileInput.disabled = true;

  projectCoverUploadPromise = (async () => {
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('category', 'project-covers');
      formData.append('alt', file.name);
      const token = getAuthToken();
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;

      const res = await fetch('/api/admin/media/upload', {
        method: 'POST',
        credentials: 'include',
        headers,
        body: formData
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');

      document.getElementById('modalProjCover').value = data.media.url;
      previewImage.src = data.media.url;
      preview.style.display = 'block';
      status.textContent = `Uploaded ${file.name}. Save the project to publish this image.`;
      showToast('Cover image uploaded. Save the project to apply it.');
      return true;
    } catch (err) {
      status.textContent = `Upload failed: ${err.message}`;
      showToast(err.message, 'error');
      fileInput.value = '';
      return false;
    } finally {
      fileInput.disabled = false;
    }
  })();
  await projectCoverUploadPromise;
}

  await apiFetch(`/api/admin/projects/${id}`, { method: 'DELETE' });

  renderTabContent('projects');
}
